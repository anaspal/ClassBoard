<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل الدخول — ClassBoard</title>
<meta name="theme-color" content="#2f6bf6">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script><script src="cloud.js"></script>
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f9;--surface:#fff;--surface-2:#eef1f6;--border:#e1e5ec;--border-strong:#cdd3dd;--text:#14181f;--text-muted:#6b7280;--brand:#2f6bf6;--brand-soft:#e8f0ff;--brand-strong:#1e50d6;--danger:#dc2626;--success:#16a34a;--shadow:0 6px 18px rgba(15,20,30,.07);--shadow-lg:0 18px 48px rgba(15,20,30,.14)}
[data-theme="dark"]{--bg:#0e1016;--surface:#171a21;--surface-2:#1d212a;--border:#262b36;--border-strong:#363d4b;--text:#e9ecf2;--text-muted:#98a0af;--brand:#5b8bff;--brand-soft:#172142;--brand-strong:#7ba3ff}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
.auth-header{padding:20px 0;display:flex;justify-content:center}
.brand-logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-family:'Inter',sans-serif;font-size:22px;font-weight:800;letter-spacing:-.02em}
.brand-logo svg{width:30px;height:30px;color:var(--brand)}
.auth-main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-lg);padding:36px 32px;width:100%;max-width:440px}
.auth-card h1{margin:0 0 6px;font-size:24px;font-weight:800;text-align:center}
.auth-card .subtitle{margin:0 0 28px;color:var(--text-muted);font-size:14px;text-align:center}
.role-tabs{display:flex;background:var(--surface-2);border-radius:14px;padding:5px;margin-bottom:24px;position:relative}
.role-tab{flex:1;padding:12px;border:none;background:transparent;border-radius:10px;font-size:14px;font-weight:600;color:var(--text-muted);transition:all .2s;position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:8px}
.role-tab.active{color:var(--brand)}
.role-tab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.role-slider{position:absolute;top:5px;bottom:5px;background:var(--surface);border-radius:10px;box-shadow:0 2px 8px rgba(15,20,30,.08);transition:all .25s cubic-bezier(.4,0,.2,1);z-index:1}
.role-slider.teacher{right:5px;width:calc(50% - 5px)}
.role-slider.student{right:calc(50% + 0px);width:calc(50% - 5px)}
.form-field{margin-bottom:16px}
.form-field label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:7px}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap svg.leading{position:absolute;inset-inline-start:14px;width:18px;height:18px;fill:none;stroke:var(--text-muted);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.input-wrap input{width:100%;padding:13px 44px 13px 44px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface-2);color:var(--text);font-size:14.5px;outline:none;transition:all .15s}
.input-wrap input:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-soft)}
.input-wrap .toggle-pass{position:absolute;inset-inline-end:10px;background:transparent;border:none;padding:6px;color:var(--text-muted);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.input-wrap input::-ms-reveal,.input-wrap input::-ms-clear{display:none}
.input-wrap input[type=password]::-webkit-credentials-auto-fill-button,.input-wrap input::-webkit-contacts-auto-fill-button{visibility:hidden;display:none!important;pointer-events:none}
.input-wrap .toggle-pass:hover{background:var(--surface-2);color:var(--text)}
.input-wrap .toggle-pass svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.field-hint{font-size:12px;color:var(--text-muted);margin-top:6px;display:flex;align-items:center;gap:6px}
.field-hint.warn{color:var(--danger)}
.field-hint.ok{color:var(--success)}
.field-hint svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-submit{width:100%;padding:14px;border-radius:12px;border:none;background:var(--brand);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;font-family:inherit}
.btn-submit:hover{background:var(--brand-strong);transform:translateY(-1px);box-shadow:0 8px 22px rgba(47,107,246,.3)}
.btn-submit:active{transform:translateY(0)}
.btn-submit:disabled{opacity:.6;cursor:not-allowed;transform:none;box-shadow:none}
.btn-submit svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.divider{margin:24px 0;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text-muted)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.notice{background:var(--brand-soft);border:1px solid rgba(47,107,246,.2);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--brand);line-height:1.6;margin-top:20px;display:flex;gap:8px}
.notice svg{flex-shrink:0;width:16px;height:16px;margin-top:2px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.auth-footer{text-align:center;padding:20px;font-size:13px;color:var(--text-muted)}
.back-home{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);text-decoration:none;font-size:13px;margin-bottom:16px}
.back-home:hover{color:var(--brand);text-decoration:none}
.back-home svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.form-error{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.2);color:var(--danger);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none;align-items:center;gap:8px}
.form-error.show{display:flex}
.form-error svg{flex-shrink:0;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:520px){
  .auth-card{padding:28px 22px}
  .auth-card h1{font-size:20px}
}
</style>
</head>
<body>

<header class="auth-header">
  <a class="brand-logo" href="index.html">
    <span>ClassBoard</span>
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="5" width="26" height="22" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <line x1="8" y1="12" x2="24" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="8" y1="17" x2="24" y2="17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="8" y1="22" x2="18" y2="22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </a>
</header>

<main class="auth-main">
  <div class="auth-card">
    <a class="back-home" href="index.html">
      <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      العودة للرئيسية
    </a>
    <h1>أهلاً بك 👋</h1>
    <p class="subtitle">اختر نوع الحساب ثم سجّل دخولك للمتابعة</p>

    <div class="role-tabs" id="role-tabs">
      <div class="role-slider teacher" id="role-slider"></div>
      <button class="role-tab active" data-role="teacher" type="button">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        معلم
      </button>
      <button class="role-tab" data-role="student" type="button">
        <svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M21 8v6M7 11v4c0 1.5 2.2 3 5 3s5-1.5 5-3v-4"/></svg>
        طالب
      </button>
    </div>

    <form id="login-form" autocomplete="off" novalidate>
      <div class="form-error" id="form-error">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5M12 16h.01"/></svg>
        <span id="form-error-text"></span>
      </div>

      <div class="form-field">
        <label for="user-name" id="name-label">اسم المعلم</label>
        <div class="input-wrap">
          <svg class="leading" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <input type="text" id="user-name" placeholder="أدخل اسمك" autocomplete="off" spellcheck="false" required>
        </div>
        <div class="field-hint" id="name-hint" style="display:none"></div>
      </div>

      <div class="form-field">
        <label for="user-pass">كلمة المرور</label>
        <div class="input-wrap">
          <svg class="leading" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" id="user-pass" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
          <button type="button" class="toggle-pass" id="toggle-pass" aria-label="إظهار كلمة المرور">
            <svg id="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">
        <span id="submit-label">دخول كمعلم</span>
        <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </form>

    <div class="divider">ملاحظة</div>
    <div class="notice">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5M12 16h.01"/></svg>
      <div>هذا إصدار تجريبي يعمل محلياً في متصفحك. بياناتك محفوظة على جهازك فقط، ولا يتم إرسالها إلى أي خادم.</div>
    </div>
  </div>
</main>

<footer class="auth-footer">
  تصميم وبرمجة: أَنَــسْ الجَعَلْ | 𝑨𝒏𝒂𝒔 𝑨𝒍-𝒋𝒂𝒂𝒍𓂆
</footer>

<script>
(function(){
'use strict';

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const USER_KEY = 'classboard.user';
const shortName=n=>String(n||'').trim().split(/\s+/).filter(Boolean).slice(0,2).join(' ');

function readSavedUser(){
  try{
    const raw = localStorage.getItem(USER_KEY);
    if(!raw) return null;
    const user = JSON.parse(raw);
    return (user && user.name) ? user : null;
  }catch(_){ return null; }
}

// Stay signed in: skip login if a session already exists
{const su=readSavedUser();if(su&&su.cloud===true){location.replace('dashboard.html');}}

// Theme
const savedTheme = localStorage.getItem('classboard.theme');
if(savedTheme) document.documentElement.dataset.theme = savedTheme;

// State
const state = {
  role: 'teacher',
};

// Read URL role hint
const urlParams = new URLSearchParams(location.search);
const roleParam = urlParams.get('role');
if(roleParam === 'student' || roleParam === 'teacher') state.role = roleParam;

// ===== Role tabs =====
function setRole(role){
  state.role = role;
  $$('.role-tab').forEach(t => t.classList.toggle('active', t.dataset.role === role));
  const slider = $('#role-slider');
  slider.classList.toggle('teacher', role === 'teacher');
  slider.classList.toggle('student', role === 'student');
  // Update labels
  $('#name-label').textContent = role === 'teacher' ? 'اسم المعلم' : 'اسم الطالب (الاسم الأول واسم الأب)';
  $('#user-name').placeholder = role === 'teacher' ? 'اكتب اسمك' : 'مثال: انس نهاد';
  $('#submit-label').textContent = role === 'teacher' ? 'دخول كمعلم' : 'دخول كطالب';
  $('#name-hint').style.display = 'none';
  hideError();
}

$$('.role-tab').forEach(tab => {
  tab.addEventListener('click', () => setRole(tab.dataset.role));
});
setRole(state.role);

// ===== Password toggle =====
$('#toggle-pass').addEventListener('click', () => {
  const inp = $('#user-pass');
  const isPass = inp.type === 'password';
  inp.type = isPass ? 'text' : 'password';
  const icon = $('#eye-icon');
  icon.innerHTML = isPass
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>';
});

// ===== Helpers =====
function countWords(str){
  return String(str).trim().split(/\s+/).filter(Boolean).length;
}
function isArabicName(str){
  return /[\u0600-\u06FF]/.test(str);
}
function showError(msg){
  $('#form-error-text').textContent = msg;
  $('#form-error').classList.add('show');
}
function hideError(){
  $('#form-error').classList.remove('show');
}
function showNameHint(msg, type='warn'){
  const hint = $('#name-hint');
  hint.className = 'field-hint ' + type;
  hint.style.display = 'flex';
  hint.innerHTML = (type === 'ok'
    ? '<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>'
    : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5M12 16h.01"/></svg>')
    + '<span>' + msg + '</span>';
}

// ===== Live name validation for student =====
$('#user-name').addEventListener('input', () => {
  const val = $('#user-name').value.trim();
  if(state.role === 'student' && val.length > 0){
    const words = countWords(val);
    if(words < 2){
      showNameHint(`الاسم يحتوي على ${words} كلمة. اكتب الاسم الأول واسم الأب`, 'warn');
    } else {
      showNameHint('الاسم صحيح ✓', 'ok');
    }
  } else {
    $('#name-hint').style.display = 'none';
  }
  hideError();
});

// ===== Form submit =====
$('#login-form').addEventListener('submit', (e) => {
  e.preventDefault();
  hideError();

  const name = $('#user-name').value.trim();
  const pass = $('#user-pass').value;

  // Validation
  if(!name){
    showError(state.role === 'teacher' ? 'الرجاء إدخال اسم المعلم' : 'الرجاء إدخال اسمك');
    $('#user-name').focus();
    return;
  }
  if(state.role === 'student'){
    const words = countWords(name);
    if(words < 2){
      showError(`اكتب الاسم الأول واسم الأب — أدخلت ${words} كلمة فقط`);
      $('#user-name').focus();
      return;
    }
    if(!isArabicName(name)){
      showError('الرجاء إدخال الاسم بالعربية');
      $('#user-name').focus();
      return;
    }
  }
  if(!pass){
    showError('الرجاء إدخال كلمة المرور');
    $('#user-pass').focus();
    return;
  }
  if(pass.length < 4){
    showError('كلمة المرور يجب أن تكون 4 أحرف على الأقل');
    $('#user-pass').focus();
    return;
  }

  // Save user profile locally (NO password stored)
  const user = {
    name: shortName(name),
    role: state.role,
    loginAt: Date.now(),
  };
  try{
    localStorage.setItem(USER_KEY, JSON.stringify(user));
    localStorage.setItem('classboard.remember', '1');
  }catch(_){}

  // Button feedback
  const btn = $('#submit-btn');
  btn.disabled = true;
  btn.innerHTML = '<span>جارٍ الدخول…</span>';

  // Redirect
  setTimeout(() => {
    location.replace('dashboard.html');
  }, 300);
});

// Focus first input
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => $('#user-name').focus(), 100);
});
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
})();
</script>
<script>
(function(){
  const f=document.querySelector('form');if(!f)return;
  const box=document.createElement('div');box.dir='rtl';box.style.cssText='margin:18px 0 0;padding-top:16px;border-top:1px solid var(--border,#e1e5ec);display:grid;gap:10px;font-family:inherit';
  box.innerHTML='<button type="button" id="g-btn" style="padding:12px;border-radius:12px;border:1px solid var(--border,#e1e5ec);background:#fff;color:#14181f;font:600 14.5px inherit;cursor:pointer">الدخول بحساب Google (للمعلم)</button>'+
  '<div style="display:flex;gap:8px"><input id="join-code" placeholder="رمز الحصة (للطالب)" maxlength="8" style="flex:1;padding:12px;border-radius:12px;border:1px solid var(--border,#e1e5ec);text-transform:uppercase;text-align:center;letter-spacing:.2em"><button type="button" id="join-btn" style="padding:12px 18px;border-radius:12px;border:none;background:var(--brand,#2f6bf6);color:#fff;font:600 14.5px inherit;cursor:pointer">انضمام</button></div><div id="cloud-msg" style="font-size:13px;color:#dc2626"></div>';
  f.insertAdjacentElement('afterend',box);
  const msg=t=>document.getElementById('cloud-msg').textContent=t;
  if(window.CB&&CB.enabled){CB.init().then(u=>{if(u)location.replace('dashboard.html');}).catch(()=>{});}
  document.getElementById('g-btn').onclick=async()=>{
    if(!window.CB||!CB.enabled){msg('الدخول بـ Google غير مفعّل بعد (ضع مفاتيح Supabase في config.js)');return;}
    try{await CB.signInGoogle();}catch(e){msg('تعذّر الدخول بـ Google');}
  };
  document.getElementById('join-btn').onclick=()=>{
    const c=document.getElementById('join-code').value.trim().toUpperCase();
    if(c.length<4){msg('أدخل رمز الحصة');return;}
    if(!window.CB||!CB.enabled){msg('المشاركة الحية غير مفعّلة بعد');return;}
    location.href='board.html?live='+encodeURIComponent(c);
  };
})();
</script>
</body>
</html>
