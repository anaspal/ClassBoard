<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClassBoard — لوحة التحكم</title>
<meta name="theme-color" content="#2f6bf6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f9;--surface:#fff;--surface-2:#eef1f6;--surface-3:#e4e8ef;
  --border:#e1e5ec;--border-strong:#cdd3dd;--text:#14181f;--text-muted:#6b7280;
  --brand:#2f6bf6;--brand-soft:#e8f0ff;--brand-strong:#1e50d6;
  --success:#16a34a;--danger:#dc2626;--warning:#f59e0b;
  --shadow-sm:0 1px 2px rgba(15,20,30,.05);
  --shadow:0 6px 18px rgba(15,20,30,.07);
  --shadow-lg:0 18px 48px rgba(15,20,30,.14);
}
[data-theme="dark"]{
  --bg:#0e1016;--surface:#171a21;--surface-2:#1d212a;--surface-3:#252a35;
  --border:#262b36;--border-strong:#363d4b;--text:#e9ecf2;--text-muted:#98a0af;
  --brand:#5b8bff;--brand-soft:#172142;--brand-strong:#7ba3ff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
a{color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ===== Header ===== */
.db-header{
  position:sticky;top:0;z-index:50;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 20px;height:60px;
  display:flex;align-items:center;gap:16px;
}
.db-header .brand-logo{
  display:inline-flex;align-items:center;gap:10px;text-decoration:none;
  color:var(--text);padding:4px 8px;border-radius:10px;transition:background .15s;
}
.db-header .brand-logo:hover{background:var(--surface-2)}
.db-header .brand-logo-text{font-family:'Inter',sans-serif;font-size:20px;font-weight:800;letter-spacing:-.02em}
.db-header .brand-logo-icon{width:26px;height:26px;color:var(--brand);flex-shrink:0}
.db-header .spacer{flex:1}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:40px;height:40px;border-radius:10px;border:1px solid transparent;
  background:transparent;color:var(--text);transition:all .15s;
}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.user-chip{
  display:inline-flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;
  border-radius:999px;background:var(--surface-2);transition:background .15s;border:none;
  color:var(--text);font-family:inherit;cursor:pointer;
}
.user-chip:hover{background:var(--surface-3)}
.user-chip .avatar{
  width:32px;height:32px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand-strong));
  background-size:cover;background-position:center;
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;flex-shrink:0;overflow:hidden;
}
.user-chip .info{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.user-chip .name{font-size:13px;font-weight:600}
.user-chip .role{font-size:10.5px;color:var(--text-muted)}

/* ===== Layout ===== */
.db-body{display:flex;min-height:calc(100vh - 60px)}

/* ===== Sidebar ===== */
.sidebar{
  width:240px;background:var(--surface);border-left:1px solid var(--border);
  padding:16px 10px;flex-shrink:0;position:sticky;top:60px;
  height:calc(100vh - 60px);overflow-y:auto;
}
[dir="ltr"] .sidebar{border-right:1px solid var(--border);border-left:none}
.sidebar .section-title{
  font-size:10.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--text-muted);
  padding:12px 12px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:10px;
  color:var(--text);text-decoration:none;font-size:13.5px;font-weight:500;
  transition:background .15s;border:none;background:transparent;
  width:100%;text-align:right;font-family:inherit;cursor:pointer;
}
[dir="ltr"] .nav-item{text-align:left}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-item svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav-item .badge{
  margin-right:auto;font-size:10px;font-weight:700;
  background:var(--warning);color:#fff;padding:2px 6px;border-radius:6px;
}
[dir="ltr"] .nav-item .badge{margin-right:0;margin-left:auto}
.nav-item.danger{color:var(--danger)}
.nav-item.danger:hover{background:rgba(220,38,38,.08)}

/* ===== Main ===== */
.db-main{flex:1;padding:28px 32px 60px;min-width:0;max-width:100%}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-head h1{margin:0 0 4px;font-size:26px;font-weight:700;letter-spacing:-.02em}
.page-head .subtitle{color:var(--text-muted);font-size:14px;margin:0}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:10px;border:1px solid transparent;
  font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;
  transition:all .15s;text-decoration:none;white-space:nowrap;
}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 4px 14px rgba(47,107,246,.25)}
.btn-primary:hover{background:var(--brand-strong);transform:translateY(-1px);box-shadow:0 6px 18px rgba(47,107,246,.32)}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--border-strong)}
.btn-icon{padding:10px}
.btn-danger{background:transparent;color:var(--danger);border-color:transparent}
.btn-danger:hover{background:rgba(220,38,38,.08)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:18px 20px;display:flex;align-items:center;gap:14px;
  transition:transform .15s,box-shadow .15s;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-icon{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.stat-icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.stat-icon.blue{background:var(--brand-soft);color:var(--brand)}
.stat-icon.green{background:rgba(22,163,74,.12);color:var(--success)}
.stat-icon.amber{background:rgba(245,158,11,.12);color:var(--warning)}
.stat-info .stat-value{font-size:22px;font-weight:700;line-height:1.1;font-family:'Inter',sans-serif}
.stat-info .stat-label{font-size:12.5px;color:var(--text-muted);margin-top:2px}

/* Toolbar */
.list-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.search-wrap{
  flex:1;min-width:220px;max-width:400px;
  position:relative;
}
.search-wrap svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;fill:none;stroke:var(--text-muted);stroke-width:2;pointer-events:none;
}
[dir="rtl"] .search-wrap svg{left:auto;right:14px}
.search-input{
  width:100%;padding:11px 14px 11px 42px;
  border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font-size:13.5px;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
[dir="rtl"] .search-input{padding:11px 42px 11px 14px}
.search-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

/* Boards grid */
.boards-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:16px;
}
.board-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s;
  display:flex;flex-direction:column;position:relative;
}
.board-card:hover{
  transform:translateY(-3px);box-shadow:var(--shadow-lg);
  border-color:var(--border-strong);
}
.board-preview{
  height:130px;background:#fff;position:relative;overflow:hidden;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}
.board-preview canvas{width:100%;height:100%;display:block}
.board-preview.theme-blackboard{background:#12161c}
.board-preview.theme-greenboard{background:#1a3a2a}
.board-preview.theme-paper{background:#efe9d8}
.board-body{padding:12px 14px 14px;flex:1;display:flex;flex-direction:column;gap:6px}
.board-name{
  font-size:14.5px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;
  overflow:hidden;text-overflow:ellipsis;cursor:pointer;
}
.board-name:hover{color:var(--brand)}
.board-meta{font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.board-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--text-muted);opacity:.6}
.board-actions{
  display:flex;gap:6px;margin-top:auto;padding-top:10px;
  border-top:1px solid var(--border);
}
.board-actions .btn{flex:1;justify-content:center;padding:7px 10px;font-size:12.5px}
.board-actions .btn-icon{flex:0 0 auto;padding:7px}

/* Empty state */
.empty-state{
  text-align:center;padding:80px 20px;
  background:var(--surface);border:1.5px dashed var(--border-strong);
  border-radius:18px;
}
.empty-state .empty-icon{
  width:80px;height:80px;margin:0 auto 20px;border-radius:20px;
  background:var(--brand-soft);color:var(--brand);
  display:flex;align-items:center;justify-content:center;
}
.empty-state .empty-icon svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.empty-state h2{margin:0 0 8px;font-size:20px;font-weight:700}
.empty-state p{margin:0 0 22px;color:var(--text-muted);font-size:14px;max-width:420px;margin-inline:auto}

/* Modal */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(15,20,30,.45);
  backdrop-filter:blur(4px);display:none;
  align-items:center;justify-content:center;z-index:100;padding:20px;
  animation:fadeIn .15s;
}
.modal-backdrop.open{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface);border-radius:16px;
  box-shadow:var(--shadow-lg);padding:24px;
  width:100%;max-width:440px;
  animation:modalIn .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 6px;font-size:18px;font-weight:700}
.modal p{margin:0 0 18px;color:var(--text-muted);font-size:13.5px}
.modal label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px}
.modal-input{
  width:100%;padding:12px 14px;border-radius:10px;
  border:1.5px solid var(--border);background:var(--surface-2);
  color:var(--text);font-size:14.5px;outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.modal-input:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--brand-soft)}
.bgpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.bgpick button{border:1.5px solid var(--border);border-radius:10px;padding:7px;background:var(--surface);cursor:pointer;text-align:center;font-family:inherit;color:var(--text-muted);font-size:12px;font-weight:600;transition:all .15s}
.bgpick button:hover{border-color:var(--border-strong)}
.bgpick button.active{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.bgpick .bgp{display:block;width:100%;aspect-ratio:16/10;border-radius:6px;border:1px solid var(--border);margin-bottom:6px;background-color:#fff;background-size:12px 12px}
.bgpick [data-bg="grid"] .bgp{background-image:linear-gradient(to right,#dde3ec 1px,transparent 1px),linear-gradient(to bottom,#dde3ec 1px,transparent 1px)}
.bgpick [data-bg="lined"] .bgp{background-image:linear-gradient(to bottom,#dde3ec 1px,transparent 1px);background-size:100% 12px}
.bgpick [data-bg="graph"] .bgp{background-image:linear-gradient(to right,#dde3ec 1px,transparent 1px),linear-gradient(to bottom,#dde3ec 1px,transparent 1px);background-size:8px 8px}
@media(max-width:480px){.bgpick{grid-template-columns:repeat(2,1fr)}}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.modal-actions .btn{padding:10px 20px}

/* Mobile */
.mobile-toggle{display:none}
@media (max-width:900px){
  .sidebar{
    position:fixed;top:60px;bottom:0;right:0;z-index:60;
    transform:translateX(100%);transition:transform .25s;box-shadow:var(--shadow-lg);
    width:min(280px,80vw);
  }
  [dir="ltr"] .sidebar{right:auto;left:0;transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .mobile-toggle{display:inline-flex}
  .db-main{padding:20px 16px 80px}
  .stats{grid-template-columns:1fr}
  .page-head h1{font-size:22px}
  .boards-grid{grid-template-columns:1fr 1fr}
  .user-chip .info{display:none}
}
@media (max-width:520px){
  .boards-grid{grid-template-columns:1fr}
  .db-header{padding:0 12px;gap:8px}
  .db-header .brand-logo-text{display:none}
}
.sidebar-backdrop{
  position:fixed;inset:60px 0 0;background:rgba(0,0,0,.4);
  z-index:55;display:none;
}
.sidebar-backdrop.open{display:block}
@media (min-width:901px){.sidebar-backdrop{display:none!important}}

/* Toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:10px 18px;
  border-radius:10px;font-size:13.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:all .25s;z-index:200;
  box-shadow:var(--shadow-lg);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ===== Header ===== -->
<header class="db-header">
  <button class="icon-btn mobile-toggle" id="mobile-toggle" aria-label="القائمة">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a href="index.html" class="brand-logo">
    <span class="brand-logo-text">ClassBoard</span>
    <svg class="brand-logo-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="5" width="26" height="22" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <line x1="8" y1="12" x2="24" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="8" y1="17" x2="24" y2="17" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="8" y1="22" x2="18" y2="22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </a>
  <div class="spacer"></div>
  <button class="icon-btn" id="theme-toggle" title="الوضع الليلي" aria-label="الوضع الليلي">
    <svg viewBox="0 0 24 24" class="icon-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
  </button>
  <button class="user-chip" id="user-menu" title="حسابك">
    <span class="info">
      <span class="name" id="user-name">المعلم</span>
      <span class="role" id="user-role">معلم</span>
    </span>
    <span class="avatar" id="user-avatar">م</span>
  </button>
</header>

<!-- ===== Body ===== -->
<div class="db-body">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="section-title">القائمة الرئيسية</div>
    <button class="nav-item active" data-nav="home">
      <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
      <span>الرئيسية</span>
    </button>
    <button class="nav-item" data-nav="account">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>الحساب</span>
    </button>

    <div class="section-title" style="margin-top:8px">الإعدادات</div>
    <button class="nav-item" data-nav="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>الإعدادات</span>
    </button>
    <button class="nav-item danger" data-nav="logout">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
      <span>تسجيل الخروج</span>
    </button>
  </aside>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <!-- Main -->
  <main class="db-main">

    <!-- Welcome -->
    <div class="page-head">
      <div>
        <h1 id="welcome-title">مرحباً 👋</h1>
        <p class="subtitle" id="welcome-sub">ابدأ بإنشاء سبورتك الأولى</p>
      </div>
      <button class="btn btn-primary" id="new-board-btn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        سبورة جديدة
      </button>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-icon blue">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg>
        </div>
        <div class="stat-info">
          <div class="stat-value" id="stat-boards">0</div>
          <div class="stat-label">سبورة محفوظة</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16"/></svg>
        </div>
        <div class="stat-info">
          <div class="stat-value" id="stat-pages">0</div>
          <div class="stat-label">صفحة إجمالية</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon amber">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        </div>
        <div class="stat-info">
          <div class="stat-value" id="stat-last">—</div>
          <div class="stat-label">آخر تعديل</div>
        </div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="list-toolbar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input class="search-input" id="search-input" type="search" placeholder="ابحث في سبوراتك…" autocomplete="off">
      </div>
    </div>

    <!-- Boards or empty -->
    <div id="boards-container"></div>

  </main>
</div>

<!-- ===== New board modal ===== -->
<div class="modal-backdrop" id="new-board-modal">
  <div class="modal">
    <h3>سبورة جديدة</h3>
    <p>أعطِ سبورتك اسماً واضحاً — مثل "درس الفيزياء — الحركة".</p>
    <label for="new-board-name">اسم السبورة</label>
    <input class="modal-input" id="new-board-name" placeholder="مثال: درس الرياضيات — النهايات" autocomplete="off" spellcheck="false">

      <button type="button" data-bg="grid"><span class="bgp"></span>شبكية</button>

    </div>
  </div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const DB_NAME = 'classboard';
const DB_VERSION = 3;
const STORE_NAME = 'boards', PROBLEMS_STORE = 'problems', FILES_STORE = 'files';
const USER_KEY = 'classboard.user';
const shortName=n=>String(n||'').trim().split(/\s+/).filter(Boolean).slice(0,2).join(' ');

function toast(msg, ms=1800){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), ms);
}

// ============ IndexedDB ============
const DB = {
  db: null,
  async open(){
    if(this.db) return this.db;
    return new Promise((resolve, reject)=>{
      const req = indexedDB.open(DB_NAME);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains(STORE_NAME)){
          const store = db.createObjectStore(STORE_NAME, {keyPath:'id'});
          store.createIndex('updatedAt','updatedAt');
        }
        if(!db.objectStoreNames.contains(PROBLEMS_STORE)) db.createObjectStore(PROBLEMS_STORE, {keyPath:'id'});
        if(!db.objectStoreNames.contains(FILES_STORE)) db.createObjectStore(FILES_STORE, {keyPath:'id'});
      };
      req.onsuccess = ()=>{ this.db = req.result; resolve(this.db); };
      req.onerror = ()=> reject(req.error);
    });
  },
  listFromLocal(){
    const out = [];
    try{
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(!k || !k.startsWith('classboard.snapshot.')) continue;
        const o = JSON.parse(localStorage.getItem(k)||'null');
        if(o && o.id) out.push(o);
      }
    }catch(_){}
    return out;
  },
  mergeBoards(a,b){
    const map = new Map();
    (a||[]).concat(b||[]).forEach(item=>{
      if(!item || !item.id) return;
      const prev = map.get(item.id);
      if(!prev || (item.updatedAt||0) >= (prev.updatedAt||0)) map.set(item.id, item);
    });
    return Array.from(map.values()).sort((x,y)=>(y.updatedAt||0)-(x.updatedAt||0));
  },
  async list(){
    const local = this.listFromLocal();
    try{
      await this.open();
      const arr = await new Promise((resolve, reject)=>{
        const tx = this.db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onsuccess = ()=> resolve(req.result || []);
        req.onerror = ()=> reject(req.error);
      });
      return this.mergeBoards(local, arr);
    }catch(e){
      console.error(e);
      return this.mergeBoards(local, []);
    }
  },
  async delete(id){
    await this.open();
    return new Promise((resolve, reject)=>{
      const tx = this.db.transaction(STORE_NAME, 'readwrite');
      const req = tx.objectStore(STORE_NAME).delete(id);
      req.onsuccess = ()=> resolve();
      req.onerror = ()=> reject(req.error);
    });
  },
  async rename(id, newName){
    await this.open();
    return new Promise((resolve, reject)=>{
      const tx = this.db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const getReq = store.get(id);
      getReq.onsuccess = ()=>{
        const board = getReq.result;
        if(!board){ resolve(false); return; }
        board.name = newName;
        board.updatedAt = Date.now();
        const putReq = store.put(board);
        putReq.onsuccess = ()=> resolve(true);
        putReq.onerror = ()=> reject(putReq.error);
      };
      getReq.onerror = ()=> reject(getReq.error);
    });
  }
};

// ============ State ============
const state = {
  user: { name:'المعلم', role:'teacher' },
  boards: [],
  filter: '',
  view: 'home'
};

// ============ User ============
function loadUser(){
  let hasSession = false;
  try{
    const raw = localStorage.getItem(USER_KEY);
    if(raw){
      const u = JSON.parse(raw);
      if(u && u.name){
        const sn = shortName(u.name);
        if(sn !== u.name){ u.name = sn; try{ localStorage.setItem(USER_KEY, JSON.stringify(u)); }catch(_){} }
        state.user = u;
        hasSession = true;
      }
    }
  }catch(_){}
  // Also check URL params (from login flow)
  const url = new URL(location.href);
  const role = url.searchParams.get('role');
  const name = url.searchParams.get('name');
  if(role) state.user.role = role;
  if(name){
    state.user.name = shortName(name);
    hasSession = true;
  }
  if(!hasSession){
    location.replace('login.html');
    return;
  }
  renderUser();
}
function renderUser(){
  const initial = (state.user.name||'م').trim().charAt(0);
  $('#user-name').textContent = state.user.name;
  $('#user-role').textContent = state.user.role === 'teacher' ? 'معلم' : 'طالب';
  const avatarEl = $('#user-avatar');
  const photo = localStorage.getItem('classboard.avatarPhoto');
  const color = localStorage.getItem('classboard.avatar');
  if(photo){
    avatarEl.textContent = '';
    avatarEl.style.backgroundImage = `url(${photo})`;
    avatarEl.style.backgroundSize = 'cover';
    avatarEl.style.backgroundPosition = 'center';
  }else{
    avatarEl.textContent = initial;
    avatarEl.style.backgroundImage = 'none';
    if(color) avatarEl.style.background = color;
  }
  $('#welcome-title').textContent = `مرحباً، ${state.user.name} 👋`;
  const isTeacher = state.user.role === 'teacher';
  $('#welcome-sub').textContent = isTeacher
    ? 'ابدأ بإنشاء سبورة جديدة لدرسك القادم'
    : 'استعرض السبورات والدروس التي شاركها معك معلمك';
  // Hide "New board" for students
  if(!isTeacher) $('#new-board-btn').style.display = 'none';
}

// ============ Format date ============
function formatDate(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  const now = new Date();
  const diffMs = now - d;
  const diffMin = Math.floor(diffMs/60000);
  const diffHr = Math.floor(diffMs/3600000);
  const diffDay = Math.floor(diffMs/86400000);
  if(diffMin < 1) return 'الآن';
  if(diffMin < 60) return `منذ ${diffMin} د`;
  if(diffHr < 24) return `منذ ${diffHr} س`;
  if(diffDay < 7) return `منذ ${diffDay} يوم`;
  const day = d.getDate().toString().padStart(2,'0');
  const month = (d.getMonth()+1).toString().padStart(2,'0');
  return `${day}/${month}/${d.getFullYear()}`;
}

// ============ Render ============
function renderStats(){
  $('#stat-boards').textContent = state.boards.length;
  const totalPages = state.boards.reduce((acc, b)=>acc + ((b.pages && b.pages.length) || 1), 0);
  $('#stat-pages').textContent = totalPages;
  const latest = state.boards[0];
  $('#stat-last').textContent = latest ? formatDate(latest.updatedAt) : '—';
}

function renderBoards(){
  const container = $('#boards-container');
  const q = state.filter.trim().toLowerCase();
  const filtered = q
    ? state.boards.filter(b => (b.name||'').toLowerCase().includes(q))
    : state.boards;

  if(state.boards.length === 0){
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="26" height="22" rx="4" transform="scale(0.9) translate(1,1)"/><path d="M8 11h10M8 15h7"/></svg>
        </div>
        <h2>لا توجد سبورات بعد</h2>
        <p>ابدأ بإنشاء سبورتك الأولى لتنظيم دروسك وشرحك.</p>
        <button class="btn btn-primary" id="empty-new-btn">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          إنشاء سبورة جديدة
        </button>
      </div>
    `;
    const btn = $('#empty-new-btn');
    if(btn) btn.addEventListener('click', openNewBoardModal);
    return;
  }

  if(filtered.length === 0){
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </div>
        <h2>لا نتائج مطابقة</h2>
        <p>جرّب كلمة بحث أخرى.</p>
      </div>
    `;
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'boards-grid';

  filtered.forEach(board => {
    const card = document.createElement('div');
    card.className = 'board-card';

    const themeClass = 'theme-' + (board.theme || 'whiteboard');
    const pageCount = (board.pages && board.pages.length) || 1;

    card.innerHTML = `
      <div class="board-preview ${themeClass}" data-id="${board.id}">
        <canvas width="480" height="260"></canvas>
      </div>
      <div class="board-body">
        <div class="board-name" data-id="${board.id}" title="${escapeHtml(board.name || 'سبورة')}">${escapeHtml(board.name || 'سبورة')}</div>
        <div class="board-meta">
          <span>${pageCount} صفحة</span>
          <span class="dot"></span>
          <span>${formatDate(board.updatedAt)}</span>
        </div>
        <div class="board-actions">
          <button class="btn btn-primary" data-open="${board.id}">فتح</button>
          <button class="btn btn-ghost btn-icon" data-rename="${board.id}" title="إعادة تسمية">
            <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/></svg>
          </button>
          <button class="btn btn-ghost btn-icon" data-delete="${board.id}" title="حذف" style="color:var(--danger)">
            <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
          </button>
        </div>
      </div>
    `;
    grid.appendChild(card);

    // Draw preview thumbnail
    requestAnimationFrame(()=>{
      const canvas = card.querySelector('canvas');
      drawBoardPreview(canvas, board);
    });
  });

  container.innerHTML = '';
  container.appendChild(grid);

  // Wire actions
  $$('[data-open]', container).forEach(el => {
    el.addEventListener('click', ()=>{
      location.href = `board.html?id=${encodeURIComponent(el.dataset.open)}`;
    });
  });
  $$('.board-preview', container).forEach(el => {
    el.addEventListener('click', ()=>{
      location.href = `board.html?id=${encodeURIComponent(el.dataset.id)}`;
    });
  });
  $$('.board-name', container).forEach(el => {
    el.addEventListener('click', ()=>{
      location.href = `board.html?id=${encodeURIComponent(el.dataset.id)}`;
    });
  });
  $$('[data-rename]', container).forEach(el => {
    el.addEventListener('click', async ()=>{
      const id = el.dataset.rename;
      const board = state.boards.find(b=>b.id===id);
      if(!board) return;
      const newName = prompt('الاسم الجديد للسبورة:', board.name || 'سبورة');
      if(newName === null) return;
      const trimmed = newName.trim();
      if(!trimmed) return;
      await DB.rename(id, trimmed);
      board.name = trimmed;
      board.updatedAt = Date.now();
      renderBoards();
      renderStats();
      toast('✓ تم التحديث');
    });
  });
  $$('[data-delete]', container).forEach(el => {
    el.addEventListener('click', async ()=>{
      const id = el.dataset.delete;
      const board = state.boards.find(b=>b.id===id);
      if(!board) return;
      const ok = confirm(`حذف "${board.name}"؟\nلا يمكن التراجع عن هذا الإجراء.`);
      if(!ok) return;
      await DB.delete(id);
      state.boards = state.boards.filter(b=>b.id!==id);
      renderBoards();
      renderStats();
      toast('تم حذف السبورة');
    });
  });
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ============ Preview Thumbnail ============
function drawBoardPreview(canvas, board){
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const WORLD_W = 1920, WORLD_H = 1080;

  // Background
  const theme = board.theme || 'whiteboard';
  let paperColor = '#ffffff';
  if(theme === 'blackboard') paperColor = '#12161c';
  else if(theme === 'greenboard') paperColor = '#1a3a2a';
  else if(theme === 'paper') paperColor = '#efe9d8';
  ctx.fillStyle = paperColor;
  ctx.fillRect(0,0,W,H);

  // Draw first page elements
  const page = board.pages && board.pages[0];
  if(!page || !page.elements || page.elements.length === 0){
    // Draw subtle "no content" hint
    ctx.fillStyle = theme === 'blackboard' ? 'rgba(255,255,255,0.15)' : 'rgba(20,30,50,0.15)';
    ctx.font = '600 18px "IBM Plex Sans Arabic", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('فارغة', W/2, H/2);
    return;
  }

  const scaleX = W / WORLD_W;
  const scaleY = H / WORLD_H;
  ctx.save();
  ctx.scale(scaleX, scaleY);

  // Background pattern (grid)
  const bg = page.background;
  if(bg === 'grid' || bg === 'graph'){
    const step = bg === 'graph' ? 20 : 40;
    ctx.strokeStyle = theme === 'blackboard' || theme === 'greenboard' ? 'rgba(255,255,255,0.1)' : 'rgba(20,30,50,0.08)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let x=0;x<=WORLD_W;x+=step){ ctx.moveTo(x,0); ctx.lineTo(x,WORLD_H); }
    for(let y=0;y<=WORLD_H;y+=step){ ctx.moveTo(0,y); ctx.lineTo(WORLD_W,y); }
    ctx.stroke();
  } else if(bg === 'lined'){
    ctx.strokeStyle = theme === 'blackboard' || theme === 'greenboard' ? 'rgba(255,255,255,0.1)' : 'rgba(20,30,50,0.08)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let y=60;y<=WORLD_H;y+=50){ ctx.moveTo(0,y); ctx.lineTo(WORLD_W,y); }
    ctx.stroke();
  }

  // Draw up to first 80 elements to keep preview fast
  const MAX = 80;
  for(let i=0; i<Math.min(page.elements.length, MAX); i++){
    try{ drawPreviewElement(ctx, page.elements[i]); }catch(_){}
  }
  ctx.restore();
}

function drawPreviewElement(ctx, el){
  if(!el) return;
  switch(el.kind){
    case 'stroke': drawPreviewStroke(ctx, el); break;
    case 'shape': drawPreviewShape(ctx, el); break;
    case 'text': drawPreviewText(ctx, el); break;
    case 'note': drawPreviewNote(ctx, el); break;
    case 'image': drawPreviewImage(ctx, el); break;
  }
}

function drawPreviewStroke(ctx, s){
  if(!s.points || s.points.length === 0) return;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = s.color || '#1a1d23';
  ctx.lineWidth = (s.width || 3) * 1.5;
  if(s.tool === 'highlighter'){ ctx.globalAlpha = 0.35; }
  ctx.beginPath();
  ctx.moveTo(s.points[0].x, s.points[0].y);
  for(let i=1;i<s.points.length;i++) ctx.lineTo(s.points[i].x, s.points[i].y);
  ctx.stroke();
  ctx.restore();
}

function drawPreviewShape(ctx, sh){
  ctx.save();
  ctx.strokeStyle = sh.color || '#1a1d23';
  ctx.fillStyle = sh.fill || 'transparent';
  ctx.lineWidth = (sh.width || 3) * 1.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  const {x1,y1,x2,y2,tool} = sh;
  if(tool === 'line' || tool === 'arrow'){
    ctx.beginPath();
    ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  } else if(tool === 'rect'){
    ctx.beginPath();
    ctx.rect(Math.min(x1,x2), Math.min(y1,y2), Math.abs(x2-x1), Math.abs(y2-y1));
    ctx.stroke();
  } else if(tool === 'circle'){
    const cx=(x1+x2)/2, cy=(y1+y2)/2;
    const rx=Math.abs(x2-x1)/2, ry=Math.abs(y2-y1)/2;
    ctx.beginPath();
    ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
    ctx.stroke();
  } else if(tool === 'triangle'){
    ctx.beginPath();
    ctx.moveTo((x1+x2)/2,y1); ctx.lineTo(x2,y2); ctx.lineTo(x1,y2); ctx.closePath();
    ctx.stroke();
  }
  ctx.restore();
}

function drawPreviewText(ctx, t){
  if(!t.content) return;
  ctx.save();
  ctx.fillStyle = t.color || '#1a1d23';
  ctx.font = `${t.bold?'700 ':'400 '}${t.fontSize||28}px "IBM Plex Sans Arabic","Inter",sans-serif`;
  ctx.textBaseline = 'top';
  const isArabic = /[\u0600-\u06FF]/.test(t.content);
  if(isArabic){ ctx.direction='rtl'; ctx.textAlign='right'; }
  else { ctx.direction='ltr'; ctx.textAlign='left'; }
  const lines = String(t.content).split('\n');
  const lh = (t.fontSize||28)*1.3;
  lines.slice(0,4).forEach((line,i)=>{
    ctx.fillText(line.slice(0, 60), t.x, t.y + i*lh);
  });
  ctx.restore();
}

function drawPreviewNote(ctx, n){
  ctx.save();
  ctx.fillStyle = n.color || '#fde68a';
  const r = 6;
  ctx.beginPath();
  ctx.moveTo(n.x+r, n.y);
  ctx.arcTo(n.x+n.w, n.y, n.x+n.w, n.y+n.h, r);
  ctx.arcTo(n.x+n.w, n.y+n.h, n.x, n.y+n.h, r);
  ctx.arcTo(n.x, n.y+n.h, n.x, n.y, r);
  ctx.arcTo(n.x, n.y, n.x+n.w, n.y, r);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawPreviewImage(ctx, im){
  if(im._img && im._img.complete){
    try{ ctx.drawImage(im._img, im.x, im.y, im.w, im.h); }catch(_){}
  } else if(!im._img){
    const img = new Image();
    img.onload = ()=>{ im._img = img; };
    img.src = im.src;
    im._img = img;
  }
}

// ============ Actions ============
let newBoardBg = 'lined';
function setNewBoardBg(bg){
  newBoardBg = bg;
  $$('#new-board-bg button').forEach(b=>{ b.classList.toggle('active', b.dataset.bg === bg); b.setAttribute('aria-checked', String(b.dataset.bg === bg)); });
}
function openNewBoardModal(){
  $('#new-board-name').value = '';
  setNewBoardBg('lined');
  $('#new-board-modal').classList.add('open');
  setTimeout(()=>$('#new-board-name').focus(), 60);
}
function closeNewBoardModal(){
  $('#new-board-modal').classList.remove('open');
}
function createBoard(){
  const name = ($('#new-board-name').value || '').trim() || 'سبورة جديدة';
  const id = 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  // Empty board shell; board.html will fill defaults when opened
  location.href = `board.html?id=${encodeURIComponent(id)}&name=${encodeURIComponent(name)}&bg=${encodeURIComponent(newBoardBg)}`;
}

// ============ Navigation ============
function setActiveNav(view){
  state.view = view;
  $$('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.nav === view);
  });
}
function handleNav(view){
  if(view === 'logout'){
    if(!confirm('تسجيل الخروج؟')) return;
    localStorage.removeItem(USER_KEY);
    localStorage.removeItem('classboard.current');
    location.href = 'index.html';
    return;
  }
  if(view === 'account'){
    location.href = 'account.html';
    return;
  }
  if(view === 'settings'){
    location.href = 'account.html';
    return;
  }
  if(view === 'home' || view === 'boards'){
    setActiveNav(view);
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }
  toast('🚧 هذه الميزة قادمة قريباً');
}

// ============ Theme ============
function initTheme(){
  const saved = localStorage.getItem('classboard.theme');
  if(saved) document.documentElement.dataset.theme = saved;
}
function toggleTheme(){
  const cur = document.documentElement.dataset.theme;
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('classboard.theme', next);
}

// ============ Sidebar mobile ============
function toggleSidebar(open){
  const sb = $('#sidebar');
  const bd = $('#sidebar-backdrop');
  if(open === undefined) open = !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  bd.classList.toggle('open', open);
}

// ============ Search ============
function bindSearch(){
  const input = $('#search-input');
  let timer = null;
  input.addEventListener('input', (e)=>{
    clearTimeout(timer);
    timer = setTimeout(()=>{
      state.filter = e.target.value;
      renderBoards();
    }, 120);
  });
}

// ============ Init ============
async function init(){
  initTheme();
  loadUser();
  bindSearch();

  // Buttons
  $('#theme-toggle').addEventListener('click', toggleTheme);
  $('#new-board-btn').addEventListener('click', openNewBoardModal);
  $('#cancel-new').addEventListener('click', closeNewBoardModal);
  $('#create-board').addEventListener('click', createBoard);
  $$('#new-board-bg button').forEach(b=>b.addEventListener('click', ()=>setNewBoardBg(b.dataset.bg)));
  $('#new-board-name').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') createBoard();
    if(e.key === 'Escape') closeNewBoardModal();
  });
  $('#new-board-modal').addEventListener('click', (e)=>{
    if(e.target === $('#new-board-modal')) closeNewBoardModal();
  });
  $('#user-menu').addEventListener('click', ()=>{
    location.href = 'account.html';
  });
  $('#mobile-toggle').addEventListener('click', ()=>toggleSidebar());
  $('#sidebar-backdrop').addEventListener('click', ()=>toggleSidebar(false));

  // Nav
  $$('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      handleNav(el.dataset.nav);
      if(window.innerWidth <= 900) toggleSidebar(false);
    });
  });

  // Load boards
  try{
    state.boards = await DB.list();
  }catch(e){
    console.error(e);
    state.boards = [];
  }
  renderStats();
  renderBoards();
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
})();
</script>
</body>
</html>
