<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصفحة غير موجودة — ClassBoard</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&family=Inter:wght@400;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f9;--surface:#fff;--border:#e1e5ec;--text:#14181f;--text-muted:#6b7280;--brand:#2f6bf6}
[data-theme="dark"]{--bg:#0e1016;--surface:#171a21;--border:#262b36;--text:#e9ecf2;--text-muted:#98a0af;--brand:#5b8bff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans Arabic','Inter',sans-serif;background:var(--bg);color:var(--text);padding:20px}
.box{text-align:center;max-width:480px}
.code{font-size:110px;font-weight:800;line-height:1;color:var(--brand);font-family:'Inter',sans-serif;letter-spacing:-.04em;margin-bottom:16px}
h1{margin:0 0 12px;font-size:26px}
p{color:var(--text-muted);margin:0 0 30px;font-size:15px;line-height:1.7}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:12px;background:var(--brand);color:#fff;text-decoration:none;font-size:14.5px;font-weight:600;transition:all .15s}
.btn:hover{background:#1e50d6;transform:translateY(-1px)}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>الصفحة غير موجودة</h1>
  <p>يبدو أن الرابط الذي تحاول الوصول إليه غير صحيح، أو أن الصفحة قد نُقلت.</p>
  <a class="btn" href="index.html">العودة للرئيسية</a>
</div>
<script>
const t = localStorage.getItem('classboard.theme');
if(t) document.documentElement.dataset.theme = t;
</script>
</body>
</html>
